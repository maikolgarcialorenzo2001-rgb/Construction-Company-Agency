<div
  data-testid="post-vacancy"
  role="group"
  aria-label="Vacante"
  class="mt-3 rounded-lg border border-ink-900/10 bg-ink-900/[0.02] p-3"
>
  <p class="text-sm font-medium text-ink-900">Vacantes disponibles</p>

  <ul class="mt-2 space-y-3">
    @for (job of openings(); track job.id) {
      <li data-testid="vacancy-entry" class="rounded-lg border border-ink-900/10 p-3">
        <p data-testid="vacancy-title" class="text-sm font-medium text-ink-900">
          {{ job.title }}
        </p>

        @if (job.location) {
          <p data-testid="vacancy-location" class="mt-1 text-xs text-ink-600">
            {{ job.location }}
          </p>
        }

        @if (job.budget !== undefined) {
          <p data-testid="vacancy-budget" class="mt-1 text-xs text-ink-600">
            {{ budgetLabel(job) }}
          </p>
        }

        <p data-testid="vacancy-status" class="mt-1 text-xs text-ink-600">
          Estado: {{ jobStatusLabel(job.status) }}
        </p>

        <a
          data-testid="vacancy-apply"
          [routerLink]="['/plataforma/trabajos', job.id]"
          [attr.aria-label]="'Postularse a ' + job.title"
          class="mt-2 inline-block text-sm font-medium text-ink-900 underline-offset-4 hover:underline"
          >Postularse</a
        >
      </li>
    }
  </ul>
</div>
