<a
  [routerLink]="['/proyectos', project().slug]"
  class="surface-card flex h-full flex-col gap-4 hover:border-brand-600"
>
  <img
    [ngSrc]="project().photos[0].image.src"
    [alt]="project().photos[0].image.alt"
    [width]="project().photos[0].image.width"
    [height]="project().photos[0].image.height"
    class="aspect-[3/2] w-full rounded-lg object-cover"
  />
  <h3 class="text-xl font-semibold text-ink-900">{{ project().title }}</h3>
  <p class="text-ink-600">{{ project().category }} · {{ project().location }}</p>
  <p class="text-ink-600">
    {{ duration(project().duration) }} · {{ area(project().surfaceAreaM2) }}
  </p>
  <span class="mt-auto font-semibold text-brand-800">Ver el proyecto</span>
</a>
