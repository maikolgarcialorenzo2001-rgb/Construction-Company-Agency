<div class="max-w-2xl">
  @if (eyebrow(); as value) {
    <p class="text-sm font-semibold uppercase tracking-wide text-brand-600">{{ value }}</p>
  }
  <h2 class="mt-2 text-section font-semibold text-ink-900">{{ title() }}</h2>
  @if (lead(); as value) {
    <p class="mt-3 text-ink-600">{{ value }}</p>
  }
</div>
