<section class="container mx-auto px-4 py-16 sm:px-6 lg:px-8">
  <h1 class="text-display font-semibold text-ink-900">Proyectos</h1>

  <div class="mt-6">
    <app-section-heading
      title="Obras terminadas, con el antes y el después"
      lead="Cada proyecto muestra qué estaba roto, qué hicimos, cuánto tardó y en qué rango de inversión se movió. Sin fotos de catálogo: son obras reales."
    />
  </div>

  <ul class="mt-10 grid list-none grid-cols-1 gap-6 p-0 sm:grid-cols-2 lg:grid-cols-3">
    @for (project of projects; track project.slug) {
      <li class="flex">
        <app-project-card [project]="project" class="w-full" />
      </li>
    }
  </ul>

  <app-cta-block class="mt-16 block" [heading]="ctaHeading" [body]="ctaBody" />
</section>
