<section class="container mx-auto px-4 py-16 sm:px-6 lg:px-8">
  <h1 class="text-display font-semibold text-ink-900">Cómo trabajamos</h1>

  <div class="mt-6">
    <app-section-heading
      title="Un proceso con etapas, plazos y responsables"
      lead="Cada etapa dice qué pasa, cuánto tarda y qué recibís. Sabés en qué momento de la obra estás y contra quién reclamás."
    />
  </div>

  <ol class="mt-10 flex list-none flex-col gap-6 p-0">
    @for (step of steps; track step.title; let index = $index) {
      <li data-testid="process-step" class="surface-card flex gap-5 p-6">
        <span
          data-testid="step-number"
          class="flex size-10 shrink-0 items-center justify-center rounded-full bg-brand-800 text-lg font-semibold text-white"
          >{{ index + 1 }}</span
        >
        <div>
          <h3 class="text-xl font-semibold text-ink-900">{{ step.title }}</h3>
          <p class="mt-2 text-ink-600">{{ step.description }}</p>
          <p data-testid="step-duration" class="mt-3 text-sm font-medium text-accent-700">
            {{ step.duration }}
          </p>
        </div>
      </li>
    }
  </ol>

  <app-cta-block class="mt-16 block" [heading]="ctaHeading" [body]="ctaBody" />
</section>
