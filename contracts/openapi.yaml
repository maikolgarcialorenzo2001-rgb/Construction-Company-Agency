openapi: 3.1.0
info:
  title: Construction Company Agency API
  description: API contract for the construction company platform (worker/company)
  version: 1.0.0
servers:
  - url: https://api.constructora-ejemplo.com.ar
    description: Production API (provisional)
tags:
  - name: auth
  - name: profiles
  - name: feed
  - name: jobs
  - name: applications

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      additionalProperties: false

    Role:
      type: string
      enum:
        - worker
        - company
        - admin

    Pagination:
      type: object
      required:
        - page
        - pageSize
        - total
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
      additionalProperties: false

    PageEnvelope:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false

    JobStatus:
      type: string
      enum:
        - open
        - closed

    JobInput:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        budget:
          type: number
          minimum: 0
        location:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
      additionalProperties: false

    Job:
      type: object
      required:
        - id
        - companyId
        - title
        - description
        - status
        - createdAt
      properties:
        id:
          type: string
        companyId:
          type: string
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        budget:
          type: number
          minimum: 0
        location:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    JobPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Job'

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      description: Number of items per page (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

paths:
  /auth/register:
    post:
      tags:
        - auth
      operationId: register
      description: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - userId
                  - token
                properties:
                  userId:
                    type: string
                  token:
                    type: string
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      description: Login with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - role
                properties:
                  token:
                    type: string
                  role:
                    $ref: '#/components/schemas/Role'
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags:
        - auth
      operationId: getMe
      description: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required:
                  - userId
                  - email
                  - role
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                  role:
                    $ref: '#/components/schemas/Role'
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs:
    post:
      tags:
        - jobs
      operationId: createJob
      description: Create a job post (company role)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobInput'
      responses:
        '201':
          description: Job post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - jobs
      operationId: listJobs
      description: List job posts with pagination
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Page of job posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/search:
    get:
      tags:
        - jobs
      operationId: searchJobs
      description: Search job posts by keyword with pagination
      parameters:
        - name: q
          in: query
          description: Free-text search term
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Page of matching job posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/{jobId}:
    get:
      tags:
        - jobs
      operationId: getJob
      description: Get a job post by id
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job post identifier
          schema:
            type: string
      responses:
        '200':
          description: Job post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - jobs
      operationId: updateJob
      description: Update a job post (company role)
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job post identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobInput'
      responses:
        '200':
          description: Updated job post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - jobs
      operationId: deleteJob
      description: Delete a job post (company role)
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job post identifier
          schema:
            type: string
      responses:
        '204':
          description: Job post deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
