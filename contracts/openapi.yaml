openapi: 3.1.0
info:
  title: Construction Company Agency API
  description: API contract for the construction company platform (worker/company)
  version: 1.0.0
servers:
  - url: https://api.constructora-ejemplo.com.ar
    description: Production API (provisional)
tags:
  - name: auth
  - name: profiles
  - name: feed
  - name: jobs
  - name: applications

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      additionalProperties: false

    Role:
      type: string
      enum:
        - worker
        - company
        - admin

    Pagination:
      type: object
      required:
        - page
        - pageSize
        - total
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
      additionalProperties: false

    PageEnvelope:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false

    JobStatus:
      type: string
      enum:
        - open
        - closed

    JobInput:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        budget:
          type: number
          minimum: 0
        location:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
      additionalProperties: false

    Job:
      type: object
      required:
        - id
        - companyId
        - title
        - description
        - status
        - createdAt
      properties:
        id:
          type: string
        companyId:
          type: string
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        budget:
          type: number
          minimum: 0
        location:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    JobPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Job'

    ApplicationStatus:
      type: string
      enum:
        - pending
        - accepted
        - rejected
        - withdrawn

    ApplicationInput:
      type: object
      required:
        - jobId
      properties:
        jobId:
          type: string
        message:
          type: string
          minLength: 1
      additionalProperties: false

    Application:
      type: object
      required:
        - id
        - jobId
        - applicantId
        - status
        - createdAt
      properties:
        id:
          type: string
        jobId:
          type: string
        applicantId:
          type: string
        message:
          type: string
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    ApplicationPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Application'

    FeedPostInput:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
        attachments:
          type: array
          items:
            type: string
      additionalProperties: false

    FeedPost:
      type: object
      required:
        - id
        - authorId
        - content
        - createdAt
      properties:
        id:
          type: string
        authorId:
          type: string
        content:
          type: string
          minLength: 1
        attachments:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    FeedPostPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FeedPost'

    WorkerProfile:
      type: object
      required:
        - userId
        - role
        - fullName
        - createdAt
      properties:
        userId:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        fullName:
          type: string
          minLength: 1
        phone:
          type: string
        location:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    WorkerProfileInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        phone:
          type: string
        location:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: string
      additionalProperties: false

    CompanyProfile:
      type: object
      required:
        - companyId
        - role
        - name
        - createdAt
      properties:
        companyId:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        name:
          type: string
          minLength: 1
        description:
          type: string
        contactEmail:
          type: string
          format: email
        website:
          type: string
        phone:
          type: string
        location:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    CompanyProfileInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        contactEmail:
          type: string
          format: email
        website:
          type: string
        phone:
          type: string
        location:
          type: string
      additionalProperties: false

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      description: Number of items per page (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

paths:
  /auth/register:
    post:
      tags:
        - auth
      operationId: register
      description: Register a new user (admin role cannot be self-assigned)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - userId
                  - token
                properties:
                  userId:
                    type: string
                  token:
                    type: string
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      description: Login with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - role
                properties:
                  token:
                    type: string
                  role:
                    $ref: '#/components/schemas/Role'
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags:
        - auth
      operationId: getMe
      description: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required:
                  - userId
                  - email
                  - role
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                  role:
                    $ref: '#/components/schemas/Role'
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs:
    post:
      tags:
        - jobs
      operationId: createJob
      description: Create a job post (company role)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobInput'
      responses:
        '201':
          description: Job post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - jobs
      operationId: listJobs
      description: List job posts with pagination
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Page of job posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/search:
    get:
      tags:
        - jobs
      operationId: searchJobs
      description: Search job posts by keyword with pagination
      parameters:
        - name: q
          in: query
          description: Free-text search term
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Page of matching job posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/{jobId}:
    get:
      tags:
        - jobs
      operationId: getJob
      description: Get a job post by id
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job post identifier
          schema:
            type: string
      responses:
        '200':
          description: Job post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - jobs
      operationId: updateJob
      description: Update a job post (company role)
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job post identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobInput'
      responses:
        '200':
          description: Updated job post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - jobs
      operationId: deleteJob
      description: Delete a job post (company role)
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job post identifier
          schema:
            type: string
      responses:
        '204':
          description: Job post deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications:
    post:
      tags:
        - applications
      operationId: createApplication
      description: Apply to a job post (worker role)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - applications
      operationId: listApplications
      description: List applications with optional filters and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: query
          description: Filter applications by job post id
          schema:
            type: string
        - name: status
          in: query
          description: Filter applications by status
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Page of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{applicationId}/status:
    patch:
      tags:
        - applications
      operationId: updateApplicationStatus
      description: Transition an application status (company or worker role)
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          description: Application identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/ApplicationStatus'
              additionalProperties: false
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /feed/posts:
    post:
      tags:
        - feed
      operationId: createFeedPost
      description: Create a feed post (worker or company role)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedPostInput'
      responses:
        '201':
          description: Feed post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPost'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /feed/timeline:
    get:
      tags:
        - feed
      operationId: getTimeline
      description: List feed posts in reverse chronological order with pagination
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Page of feed posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPostPage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /feed/posts/{postId}:
    get:
      tags:
        - feed
      operationId: getFeedPost
      description: Get a feed post by id
      parameters:
        - name: postId
          in: path
          required: true
          description: Feed post identifier
          schema:
            type: string
      responses:
        '200':
          description: Feed post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPost'
        '404':
          description: Feed post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - feed
      operationId: updateFeedPost
      description: Update a feed post (author role)
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Feed post identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedPostInput'
      responses:
        '200':
          description: Updated feed post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPost'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Feed post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - feed
      operationId: deleteFeedPost
      description: Delete a feed post (author role)
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: Feed post identifier
          schema:
            type: string
      responses:
        '204':
          description: Feed post deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Feed post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profiles/worker/{userId}:
    get:
      tags:
        - profiles
      operationId: getWorkerProfile
      description: Get a worker profile by user id
      parameters:
        - name: userId
          in: path
          required: true
          description: User identifier
          schema:
            type: string
      responses:
        '200':
          description: Worker profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerProfile'
        '404':
          description: Worker profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - profiles
      operationId: updateWorkerProfile
      description: Update a worker profile (worker owner or admin)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerProfileInput'
      responses:
        '200':
          description: Updated worker profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerProfile'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Worker profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profiles/company/{companyId}:
    get:
      tags:
        - profiles
      operationId: getCompanyProfile
      description: Get a company profile by company id
      parameters:
        - name: companyId
          in: path
          required: true
          description: Company identifier
          schema:
            type: string
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '404':
          description: Company profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - profiles
      operationId: updateCompanyProfile
      description: Update a company profile (company owner or admin)
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          description: Company identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfileInput'
      responses:
        '200':
          description: Updated company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Company profile not found
          content:
